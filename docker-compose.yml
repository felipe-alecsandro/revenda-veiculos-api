version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: revenda-veiculos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: revenda
      POSTGRES_PASSWORD: revenda123
      POSTGRES_DB: revenda_veiculos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revenda -d revenda_veiculos"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
